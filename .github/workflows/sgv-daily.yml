# Daily SGV update: scores every finished regular-season start, commits the
# refreshed results and publishes the leaderboards on GitHub Pages.
name: Daily SGV update

on:
  schedule:
    # 08:47 UTC every day from March to October, after the previous night's games are final.
    - cron: "47 8 * 3-10 *"
    # Off-season keep-alive, 15 November and 10 January: GitHub pauses scheduled
    # workflows after 60 days without repository activity, which would stop the
    # daily update before March. These runs only re-enable the schedule.
    - cron: "17 9 15 11 *"
    - cron: "17 9 10 1 *"
  workflow_dispatch:   # "Run workflow" button in the Actions tab
    inputs:
      inspect:
        description: "MLB ids of photos to draw on inspection sheets (comma-separated, optional)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sgv-daily
  cancel-in-progress: false

jobs:
  keep-alive:
    if: github.event.schedule == '17 9 15 11 *' || github.event.schedule == '17 9 10 1 *'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep the daily schedule active over the off-season
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/sgv-daily.yml/enable"

  update:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '47 8 * 3-10 *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Box scores of finished games are kept between runs, so a daily run only
      # downloads the previous day's games.
      - name: Restore box-score cache
        uses: actions/cache@v6
        with:
          path: cache
          key: boxscores-${{ github.run_id }}
          restore-keys: boxscores-

      - name: Compute SGV, MLB and minor leagues (2025 to current season)
        env:
          SGV_INSPECT: ${{ inputs.inspect }}
        run: python sgv.py --no-open --seasons $(seq 2025 "$(date -u +%Y)")

      # The Excel file changes on every save (timestamps), so commit only when the
      # leaderboards, park factors, ND thresholds or player photos (and their review files) changed.
      - name: Commit updated results
        run: |
          git add sgv_report.html park_factors.csv nd_thresholds.csv player_photos.json \
                  photo_review.csv photo_review.html docs/photo_check \
                  sgv_milb.html milb_nd_thresholds.csv milb_park_factors.csv
          if git diff --cached --quiet; then
            echo "No new games since the last update."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add sgv_records.xlsx sgv_milb_records.xlsx
          git commit -m "SGV update $(date -u +%Y-%m-%d)"
          git push

      - name: Prepare the leaderboards page
        run: |
          mkdir -p _site
          cp sgv_report.html _site/index.html
          cp sgv_records.xlsx photo_review.html sgv_milb.html sgv_milb_records.xlsx _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
